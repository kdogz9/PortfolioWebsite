# Deploy portfolio website and automatically generated JSDoc documentation
name: Deploy portfolio and documentation to Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:

      # Get the files from the GitHub repository
      - name: Checkout
        uses: actions/checkout@v4


      # Install Node.js so JSDoc can run
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # Install the packages listed in package-lock.json
      - name: Install dependencies
        run: npm ci


      # Create a clean folder containing the website
      - name: Prepare website
        run: |
          mkdir _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='_site' \
            --exclude='generated-docs' \
            ./ _site/


      # Automatically create documentation from src/example.js
      - name: Generate JSDoc documentation
        run: npx jsdoc src -d _site/generated-docs


      # Configure GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5


      # Upload the finished website and documentation
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'


      # Publish everything to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5